name: KRA전국 승부예상AI_V12.00 Auto Update

on:
  workflow_dispatch: # 웹에서 버튼 누르면 즉시 수동 실행
  schedule:
    # 1. 수, 목, 금, 토, 일, 월 08:30 KST (사전 출마표 수집 & 왜곡 분석)
    - cron: '30 23 * * 2,3,4,5,6,0'
    # 2. 목, 금, 토, 일, 월 18:30 KST (결과 복기 및 정산)
    - cron: '30 9 * * 4,5,6,0,1'

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: KRA전국 승부예상AI_V12.00 데이터 수집 및 가치 왜곡 분석
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
          TZ: "Asia/Seoul"
        run: |
          python update_data.py

      - name: 갱신된 분석 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add race_data.json
          git commit -m "Auto: [KRA전국 승부예상AI_V12.00] 가치 왜곡 탐지 분석 갱신 [skip ci]" || echo "변경사항 없음"
          git push
